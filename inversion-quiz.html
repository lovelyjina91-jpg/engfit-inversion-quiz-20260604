<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영핏영어 · 도치구문 퀴즈</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F4F6F8; --card:#FFFFFF; --ink:#13171C; --gray:#4B535C;
    --green:#157A3A; --greenbg:#DCEFE0; --gold:#B45309; --goldbg:#FBEBD3;
    --navy:#1B2970; --blue:#1D4ED8; --bluebg:#DEE6FB;
    --red:#C81E1E; --redbg:#FBE3E3; --line:#D7DCE3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.4; min-height:100%;
  }
  .wrap{max-width:760px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
    padding:clamp(16px,3.5vw,32px);}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px;}
  .logo{font-size:clamp(16px,3vw,22px); font-weight:800; color:var(--gray); letter-spacing:-.02em;}
  .logo b{color:var(--green)}
  .score-pill{font-size:clamp(15px,2.6vw,20px); font-weight:800; color:var(--navy);
    background:var(--bluebg); padding:6px 16px; border-radius:999px;}
  .prog{height:10px; background:#E4E8EE; border-radius:999px; overflow:hidden; margin-bottom:6px;}
  .prog > i{display:block; height:100%; width:0; background:var(--green); border-radius:999px; transition:width .3s ease;}
  .prog-label{font-size:clamp(13px,2.3vw,16px); color:var(--gray); font-weight:700; margin-bottom:22px;}

  .screen{flex:1; display:flex; flex-direction:column; justify-content:center; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  .start-title{font-size:clamp(30px,7vw,58px); font-weight:800; letter-spacing:-.03em; line-height:1.1;}
  .start-title .o{color:var(--gold)}
  .name-row{margin-top:38px;}
  .name-row label{display:block; font-size:clamp(15px,2.8vw,20px); font-weight:800; color:var(--navy); margin-bottom:10px;}
  input.name{width:100%; font-family:inherit; font-size:clamp(18px,3.8vw,26px); font-weight:700; color:var(--ink);
    background:var(--card); border:2.5px solid var(--line); border-radius:14px; padding:14px 18px; outline:none;}
  input.name:focus{border-color:var(--green);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;
    font-family:inherit; font-weight:800; border:none; border-radius:14px; transition:transform .08s ease, background .2s ease;}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--green); color:#fff; font-size:clamp(19px,3.8vw,26px); padding:16px 26px; width:100%; margin-top:26px;}
  .btn-primary:hover{background:#11652f}

  .qtag{display:inline-block; font-size:clamp(13px,2.4vw,17px); font-weight:800; letter-spacing:.04em;
    color:var(--gold); background:var(--goldbg); padding:5px 14px; border-radius:999px; margin-bottom:18px; align-self:flex-start;}
  .qprompt{font-size:clamp(21px,4.3vw,38px); font-weight:800; line-height:1.45; letter-spacing:-.01em; margin-bottom:8px;}
  .qprompt .slot{display:inline-block; min-width:2.2em; text-align:center; color:var(--gold);
    border-bottom:.16em solid var(--gold); margin:0 .1em;}
  .qprompt .slot.ok{color:var(--green); border-bottom-color:transparent;}
  .qprompt .slot.no{color:var(--red); border-bottom-color:transparent;}
  .qko{font-size:clamp(15px,2.8vw,21px); color:var(--gray); font-weight:600; margin-bottom:24px;}
  .opts{display:flex; flex-direction:column; gap:13px;}
  .opt{font-family:inherit; text-align:left; cursor:pointer; background:var(--card);
    border:2.5px solid var(--line); border-radius:16px; padding:clamp(14px,2.6vw,20px) clamp(16px,3vw,24px);
    font-size:clamp(17px,3.3vw,27px); font-weight:700; color:var(--ink); transition:all .15s ease; display:flex; align-items:center; gap:14px; line-height:1.35;}
  .opt:hover{border-color:#A9B2BE;}
  .opt .mk{flex:0 0 auto; width:1.5em; height:1.5em; border-radius:50%; border:2.5px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center; font-size:.8em; color:#fff;}
  .opt.correct{border-color:var(--green); background:var(--greenbg); color:#0f5f2c;}
  .opt.correct .mk{background:var(--green); border-color:var(--green);}
  .opt.wrong{border-color:var(--red); background:var(--redbg); color:#8e1414;}
  .opt.wrong .mk{background:var(--red); border-color:var(--red);}
  .opt[disabled]{cursor:default;}

  .explain{margin-top:20px; background:var(--card); border:2.5px solid var(--green); border-left-width:.6em;
    border-radius:14px; padding:clamp(15px,2.8vw,22px); animation:fade .25s ease;}
  .explain .h{font-size:clamp(15px,2.8vw,20px); font-weight:800; color:var(--green); margin-bottom:8px;}
  .explain.bad{border-color:var(--red);} .explain.bad .h{color:var(--red);}
  .explain .b{font-size:clamp(15px,2.9vw,22px); font-weight:600; line-height:1.5; color:var(--ink);}
  .explain .b b{color:var(--gold);}
  .next-btn{margin-top:18px; background:var(--navy); color:#fff; font-size:clamp(18px,3.6vw,24px); padding:15px 24px; width:100%;}
  .next-btn:hover{background:#141d52}
  .ok-flash{margin-top:18px; text-align:center; font-size:clamp(18px,3.6vw,26px); font-weight:800; color:var(--green); height:1.4em;}

  #resultCard{background:var(--card); border:2.5px solid var(--line); border-radius:22px;
    padding:clamp(24px,5vw,42px); text-align:center;}
  .r-logo{font-size:clamp(15px,2.8vw,20px); font-weight:800; color:var(--gray); margin-bottom:6px;}
  .r-logo b{color:var(--green)}
  .r-title{font-size:clamp(22px,4.6vw,34px); font-weight:800; color:var(--navy); margin-bottom:4px;}
  .r-name{font-size:clamp(16px,3vw,22px); font-weight:700; color:var(--gray); margin-bottom:20px;}
  .r-score{font-size:clamp(52px,13vw,96px); font-weight:800; line-height:1; color:var(--green); letter-spacing:-.02em;}
  .r-score .tot{color:var(--gray); font-size:.42em; font-weight:800;}
  .r-pct{font-size:clamp(18px,3.6vw,26px); font-weight:800; color:var(--gold); margin-top:10px;}
  .r-msg{font-size:clamp(16px,3.1vw,23px); font-weight:700; color:var(--ink); margin-top:14px; line-height:1.5;}
  .r-date{font-size:clamp(12px,2.2vw,15px); color:var(--gray); font-weight:600; margin-top:18px;}
  .r-actions{display:flex; flex-direction:column; gap:14px; margin-top:24px;}
  .btn-kakao{background:#FAE100; color:#191600; font-size:clamp(18px,3.6vw,24px); padding:16px 24px;}
  .btn-kakao:hover{background:#f2d800}
  .btn-retry{background:var(--card); color:var(--navy); border:2.5px solid var(--navy); font-size:clamp(17px,3.4vw,23px); padding:15px 24px;}
  .btn-retry:hover{background:#eef1f8}
  .btn-review{background:none; color:var(--gray); border:2.5px solid var(--line); font-size:clamp(16px,3.2vw,21px); padding:13px 24px;}

  .review{margin-top:24px; display:none;}
  .review.show{display:block;}
  .review h3{font-size:clamp(18px,3.4vw,24px); font-weight:800; color:var(--red); margin-bottom:14px;}
  .rv-item{background:var(--card); border:2px solid var(--line); border-left:.5em solid var(--red); border-radius:12px;
    padding:clamp(14px,2.8vw,20px); margin-bottom:12px;}
  .rv-q{font-size:clamp(16px,3vw,22px); font-weight:700; line-height:1.45;}
  .rv-q .a{color:var(--green); font-weight:800;}
  .rv-e{font-size:clamp(14px,2.6vw,19px); color:var(--gray); font-weight:600; margin-top:7px; line-height:1.45;}
  .rv-perfect{text-align:center; font-size:clamp(18px,3.6vw,26px); font-weight:800; color:var(--green); padding:10px;}

  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:clamp(14px,2.6vw,18px); font-weight:700;
    padding:14px 22px; border-radius:12px; opacity:0; transition:all .3s ease; pointer-events:none; z-index:50; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">영핏<b>영어</b> · 도치 퀴즈</div>
    <div class="score-pill" id="scorePill">0점</div>
  </div>
  <div class="prog" id="progWrap"><i id="progBar"></i></div>
  <div class="prog-label" id="progLabel"></div>

  <!-- START -->
  <div class="screen" id="screenStart">
    <h1 class="start-title">도치구문 <span class="o">반복 퀴즈</span></h1>
    <div class="name-row">
      <label for="nameInput">이름 (결과 화면에 표시돼요)</label>
      <input class="name" id="nameInput" type="text" placeholder="예: 김지나" maxlength="20" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="startBtn">시작하기 ▶</button>
  </div>

  <!-- QUIZ -->
  <div class="screen hidden" id="screenQuiz">
    <span class="qtag" id="qtag"></span>
    <div class="qprompt" id="qprompt"></div>
    <div class="qko" id="qko"></div>
    <div class="opts" id="opts"></div>
    <div id="feedback"></div>
  </div>

  <!-- RESULT -->
  <div class="screen hidden" id="screenResult">
    <div id="resultCard">
      <div class="r-logo">영핏<b>영어</b> · 도치구문 퀴즈</div>
      <div class="r-title">도치구문 퀴즈 결과</div>
      <div class="r-name" id="rName"></div>
      <div class="r-score"><span id="rScore">0</span><span class="tot" id="rTot">/0</span></div>
      <div class="r-pct" id="rPct"></div>
      <div class="r-msg" id="rMsg"></div>
      <div class="r-date" id="rDate"></div>
    </div>
    <div class="r-actions">
      <button class="btn btn-kakao" id="shareBtn">📩 카톡으로 결과 보내기</button>
      <button class="btn btn-review" id="reviewBtn">틀린 문제 다시 보기</button>
      <button class="btn btn-retry" id="retryBtn">🔄 다시 풀기 (문제 섞기)</button>
    </div>
    <div class="review" id="review"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ===== 문제 은행 (도치 기본문제 1~70, 정답지 기준) =====
   q 안의 ___ 가 빈칸. ans = opts 배열에서 정답 인덱스. */
const BANK = [
 {t:'장소 도치', q:"Under the big tree ___.", ko:"큰 나무 아래에 두 소녀가 서 있었다.",
  o:["stood two girls","two girls stood"], a:0,
  e:"장소부사구가 앞 → 동사 그대로 주어 앞으로(do 안 씀). <b>stood</b> + 주어."},
 {t:'장소 도치', q:"On the table ___ I've been looking for.", ko:"내가 찾던 그 책이 탁자 위에 있다.",
  o:["is the book","the book is"], a:0,
  e:"장소부사구 도치 → 동사 <b>is</b> + 주어(the book)."},
 {t:'부정어 도치', q:"Never ___ chocolate before bedtime.", ko:"나는 자기 전엔 절대 초콜릿을 안 먹어.",
  o:["do I eat","I do eat"], a:0,
  e:"부정어 <b>Never</b> 앞 → 「do + 주어 + 동사원형」."},
 {t:'부정어 도치', q:"Little ___ that the team would win.", ko:"그 팀이 이길 줄은 거의 생각 못 했어.",
  o:["did we think","we did think"], a:0,
  e:"<b>Little</b>(부정어) 도치 → did + 주어 + 동사원형."},
 {t:'부정어 도치', q:"Hardly ___ keep my eyes open.", ko:"나는 눈을 거의 못 뜨겠어.",
  o:["can I","I can"], a:0,
  e:"부정어 <b>Hardly</b> + 조동사 → 「can + 주어」."},
 {t:'방향 도치', q:"Around the corner ___.", ko:"모퉁이를 돌아 차 한 대가 왔다.",
  o:["came a car","a car came","did come a car"], a:0,
  e:"방향/장소부사구 도치 → 동사 그대로 <b>came</b> + 주어(a car). do 안 씀."},
 {t:'장소 도치', q:"On the stage ___.", ko:"무대 위에서 그 소년이 노래했다.",
  o:["sang the boy","the boy sang","did sing the boy"], a:0,
  e:"장소부사구 도치 → 동사 <b>sang</b> + 주어."},
 {t:'부정어 도치', q:"Never ___ for school.", ko:"그녀는 학교에 결코 지각하지 않았다.",
  o:["was she late","she was late","did she late"], a:0,
  e:"부정어 Never 도치 → be동사 <b>was</b> + 주어."},
 {t:'부정어 도치', q:"Hardly ___ him.", ko:"나는 그를 거의 믿지 않는다.",
  o:["do I trust","I trust","do I trusted"], a:0,
  e:"Hardly 도치 → 「do + 주어 + 동사원형(trust)」."},
 {t:'부정어 도치', q:"Rarely ___ breakfast.", ko:"그는 아침을 거의 안 먹는다.",
  o:["does he eat","he eats","does he eats"], a:0,
  e:"3인칭 단수라 <b>does</b> + 동사원형(eat)."},
 {t:'so 동의', q:'"I\'m very interested in ball sports." — "So ___."', ko:'"나 구기 종목에 관심 많아." "나도 그래."',
  o:["am I","do I","I am"], a:0,
  e:"be동사 문장에 동의 → 「so + be동사 + 주어」 = So am I."},
 {t:'so 동의', q:'"I want to drink some water." — "So ___."', ko:'"나 물 좀 마시고 싶어." "나도 그래."',
  o:["do I","am I","I do"], a:0,
  e:"일반동사 문장에 동의 → 「so + do + 주어」 = So do I."},
 {t:'neither 동의', q:'"I won\'t see the movie." — "Neither ___."', ko:'"난 그 영화 안 볼래." "나도 안 봐."',
  o:["will I","do I","am I"], a:0,
  e:"won't(will)에 부정 동의 → 「neither + will + 주어」."},
 {t:'so 동의', q:'"Tom enjoys skating and skiing." — "So ___."', ko:'"톰은 스케이트랑 스키를 즐겨." "걔도 그래."',
  o:["does he","is he","do he"], a:0,
  e:"일반동사 현재 3인칭 → 「so + does + he」."},
 {t:'neither 동의', q:'"I didn\'t have lunch." — "Neither ___."', ko:'"나 점심 안 먹었어." "나도 안 먹었어."',
  o:["did I","do I","was I"], a:0,
  e:"didn't(과거)에 동의 → 「neither + did + 주어」."},
 {t:'어순 배열', q:"‘꽃 위에’ 부분을 강조해 바르게 배열한 것은?", ko:"꽃 위에 나비 한 마리가 앉았다.",
  o:["On a flower sat a butterfly.","On a flower a butterfly sat.","A butterfly sat on a flower."], a:0,
  e:"장소부사구(On a flower) 도치 → 동사 <b>sat</b> + 주어."},
 {t:'어순 배열', q:"‘결코’ 부분을 강조해 바르게 배열한 것은?", ko:"내가 1등을 할 것이라고는 결코 꿈꾼 적이 없다.",
  o:["Never did I dream of winning first place.","Never I did dream of winning first place.","Never did dream I of winning first place."], a:0,
  e:"부정어 Never 도치 → 「did + 주어 + 동사원형」."},
 {t:'어순 배열', q:"‘거의’ 부분을 강조해 바르게 배열한 것은?", ko:"이런 폭우를 거의 본 적이 없다.",
  o:["Hardly have I seen such heavy rain.","Hardly I have seen such heavy rain.","Hardly have seen I such heavy rain."], a:0,
  e:"부정어 Hardly + 완료 → 「have + 주어 + p.p.」."},
 {t:'어순 배열', q:"‘언덕 아래로’ 부분을 강조해 바르게 배열한 것은?", ko:"그 언덕 아래로 큰 눈덩이가 굴러 내려갔다.",
  o:["Down the hill rolled a big snowball.","Down the hill a big snowball rolled.","Down the hill did roll a big snowball."], a:0,
  e:"방향부사구 도치 → 동사 <b>rolled</b> + 주어."},
 {t:'어순 배열', q:"‘거의’ 부분을 강조해 바르게 배열한 것은?", ko:"그녀가 밤에 나에게 전화하는 일은 거의 없다.",
  o:["Rarely does she call me at night.","Rarely she does call me at night.","Rarely does she calls me at night."], a:0,
  e:"Rarely 도치 → 「does + 주어 + 동사원형(call)」."},
 {t:'장소 도치', q:"Behind the door ___.", ko:"문 뒤에 그 아이가 숨었다.",
  o:["hid the kid","the kid hid"], a:0,
  e:"장소부사구 도치 → 동사 <b>hid</b> + 주어."},
 {t:'장소 도치', q:"Under the table ___.", ko:"식탁 밑에 내 고양이가 누워 있었다.",
  o:["lay my cat","my cat lay"], a:0,
  e:"장소부사구 도치 → 동사 <b>lay</b> + 주어."},
 {t:'부정어 도치', q:"Never ___ seen a child with so much talent.", ko:"그렇게 재능 많은 아이는 본 적이 없다.",
  o:["have I","I have"], a:0,
  e:"부정어 + 완료 → 「have + 주어 + p.p.」."},
 {t:'부정어 도치', q:"Rarely ___ this year.", ko:"올해는 눈이 거의 안 왔다.",
  o:["did it snow","it snowed"], a:0,
  e:"Rarely 도치 → 「did + 주어 + 동사원형」."},
 {t:'부정어 도치', q:"Hardly ___ in front of people.", ko:"그는 사람들 앞에서 거의 말을 안 한다.",
  o:["does he talk","he talks"], a:0,
  e:"Hardly 도치 → 「does + 주어 + 동사원형(talk)」."},
 {t:'장소 도치', q:"In the basket ___.", ko:"바구니 안에 작은 강아지들이 있었다.",
  o:["were little puppies","little puppies were","was little puppies"], a:0,
  e:"장소부사구 도치, 주어가 복수(puppies) → <b>were</b>."},
 {t:'장소 도치', q:"On the top of the hill ___.", ko:"언덕 꼭대기에 오래된 성이 서 있다.",
  o:["stands an old castle","an old castle stands","stand an old castle"], a:0,
  e:"장소부사구 도치, 주어 단수(castle) → <b>stands</b>."},
 {t:'부정어 도치', q:"Rarely ___ Jane.", ko:"그는 제인을 거의 만날 수 없었다.",
  o:["could he meet","he could meet","could he met"], a:0,
  e:"부정어 + 조동사 could 도치 → 「could + 주어 + 동사원형」."},
 {t:'부정어 도치', q:"Never ___ such a strange story.", ko:"그렇게 이상한 이야기는 들어본 적이 없다.",

/* ===== 상태 ===== */
let order=[], idx=0, score=0, wrong=[], answered=false, studentName="";
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function show(screen){
  ['screenStart','screenQuiz','screenResult'].forEach(s=>$(s).classList.toggle('hidden', s!==screen));
  const quiz = screen==='screenQuiz';
  $('progWrap').style.display = quiz?'block':'none';
  $('progLabel').style.display = quiz?'block':'none';
  $('scorePill').style.visibility = (screen==='screenStart')?'hidden':'visible';
}

function start(){
  studentName = ($('nameInput').value || '').trim() || '학생';
  order = shuffle([...Array(BANK.length).keys()]);
  idx=0; score=0; wrong=[];
  $('scorePill').textContent='0점';
  show('screenQuiz');
  render();
}

function render(){
  answered=false;
  const q=BANK[order[idx]];
  $('qtag').textContent=q.t;
  $('qprompt').innerHTML=q.q.replace('___','<span class="slot" id="slot">?</span>');
  $('qko').textContent=q.ko||'';
  $('feedback').innerHTML='';
  const correctText=q.o[q.a];
  const opts=shuffle(q.o);
  const box=$('opts'); box.innerHTML='';
  opts.forEach(t=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="mk"></span><span class="ot"></span>';
    b.querySelector('.ot').textContent=t;
    b.onclick=()=>choose(b, t, correctText);
    box.appendChild(b);
  });
  $('progBar').style.width=Math.round(idx/BANK.length*100)+'%';
  $('progLabel').textContent=(idx+1)+' / '+BANK.length+' 문제';
}

function choose(btn, text, correctText){
  if(answered) return; answered=true;
  const buttons=[...document.querySelectorAll('.opt')];
  buttons.forEach(b=>b.setAttribute('disabled',''));
  const slot=$('slot');
  if(text===correctText){
    btn.classList.add('correct'); btn.querySelector('.mk').textContent='✓';
    score++; $('scorePill').textContent=score+'점';
    if(slot){ slot.textContent=text; slot.className='slot ok'; }
    $('feedback').innerHTML='<div class="ok-flash">정답! 👍</div>';
    setTimeout(next, 200);
  }else{
    btn.classList.add('wrong'); btn.querySelector('.mk').textContent='✕';
    buttons.forEach(b=>{ if(b.querySelector('.ot').textContent===correctText){ b.classList.add('correct'); b.querySelector('.mk').textContent='✓'; }});
    if(slot){ slot.textContent=text; slot.className='slot no'; }
    const q=BANK[order[idx]];
    wrong.push({q:q.q, ko:q.ko, correct:correctText, exp:q.e});
    $('feedback').innerHTML=
      '<div class="explain bad"><div class="h">💡 해설 · 정답은 “'+correctText+'”</div>'+
      '<div class="b">'+q.e+'</div></div>'+
      '<button class="btn next-btn" id="nextBtn">다음 문제 ▶</button>';
    $('nextBtn').onclick=next;
  }
}

function next(){
  idx++;
  if(idx>=order.length) result();
  else render();
}

function result(){
  const tot=BANK.length, pct=Math.round(score/tot*100);
  $('rName').textContent=studentName;
  $('rScore').textContent=score;
  $('rTot').textContent='/'+tot;
  $('rPct').textContent='정답률 '+pct+'%';
  let msg;
  if(pct===100) msg='완벽해요! 도치 마스터 🏆';
  else if(pct>=80) msg='훌륭해요! 거의 다 잡았어요 ✨';
  else if(pct>=60) msg='좋아요! 틀린 것만 다시 보면 완성 💪';
  else msg='괜찮아요, 해설 보고 한 번 더! 🔁';
  $('rMsg').textContent=msg;
  const d=new Date();
  $('rDate').textContent=d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'  도치구문 퀴즈';
  $('progBar').style.width='100%';
  const rv=$('review'); rv.classList.remove('show'); rv.innerHTML='';
  $('reviewBtn').textContent='틀린 문제 다시 보기'+(wrong.length?' ('+wrong.length+')':'');
  show('screenResult');
}

function buildReview(){
  const rv=$('review');
  if(wrong.length===0){ rv.innerHTML='<div class="rv-perfect">틀린 문제가 없어요! 🎉</div>'; return; }
  rv.innerHTML='<h3>틀린 문제 해설 ('+wrong.length+')</h3>'+wrong.map(w=>{
    const stem = w.q.includes('___') ? w.q.replace('___','<span class="a">'+w.correct+'</span>')
                                     : (w.q+' <span class="a">→ '+w.correct+'</span>');
    return '<div class="rv-item"><div class="rv-q">'+stem+
    (w.ko?'<br><span style="color:var(--gray);font-weight:600;font-size:.85em">'+w.ko+'</span>':'')+'</div>'+
    '<div class="rv-e">'+w.exp+'</div></div>';
  }).join('');
}

/* ===== 카톡 공유 (결과 이미지) ===== */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
async function shareResult(){
  const card=$('resultCard');
  let canvas;
  try{ canvas=await html2canvas(card,{backgroundColor:'#ffffff',scale:2}); }
  catch(e){ toast('이미지 생성 실패. 화면을 캡처해서 보내주세요.'); return; }
  const text=studentName+' 도치구문 퀴즈 결과: '+score+'/'+BANK.length+' ('+Math.round(score/BANK.length*100)+'%)';
  canvas.toBlob(async(blob)=>{
    const file=new File([blob],'inversion-quiz-result.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'도치구문 퀴즈 결과', text}); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
    if(navigator.share){
      try{ await navigator.share({title:'도치구문 퀴즈 결과', text, url:location.href}); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download='inversion-quiz-result.png'; a.click();
    toast('결과 이미지를 저장했어요. 카톡으로 보내주세요!');
  },'image/png');
}

/* ===== 이벤트 ===== */
$('startBtn').onclick=start;
$('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
$('shareBtn').onclick=shareResult;
$('retryBtn').onclick=start;
$('reviewBtn').onclick=()=>{ const rv=$('review'); if(!rv.classList.contains('show')){ buildReview(); rv.classList.add('show'); rv.scrollIntoView({behavior:'smooth'}); } else { rv.classList.remove('show'); } };

show('screenStart');
</script>
